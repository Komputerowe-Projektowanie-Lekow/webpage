# Docs: https://github.com/Azure/webapps-deploy
# Deploys this repo to Azure App Service "gorzelanczyk-web".
# Dependencies are installed on the server by Oryx because the App Service
# app setting SCM_DO_BUILD_DURING_DEPLOYMENT=true is set.

name: Build and deploy Node.js app to Azure Web App - gorzelanczyk-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Package source for deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "notes/*" \
            -x "mds/*" \
            -x "python-http-server.*.log"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1DE2A622643428D8F40508BA57C4389 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CD5BB434D80C4ACDA64B96E1DD3F8527 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_929A90FF570547CFB09DE82A7AAF75F2 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gorzelanczyk-web'
          slot-name: 'Production'
          package: release.zip
